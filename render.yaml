services:
  # ----------------------------------------------------------------------------
  # 1. VERITAS Core Fact-Checking Backend (Render Free Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: veritas-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "20"

  # ----------------------------------------------------------------------------
  # 2. VERITAS Interactive Frontend (Render Free Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: veritas-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
